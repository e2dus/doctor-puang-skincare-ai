<!DOCTYPE html>
<html>
<head>
  <!--

    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="mobileprogramming_groupproject_2025">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>mobileprogramming_groupproject_2025</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // HTML 렌더러 사용 (CanvasKit 대신)
    // flutter_bootstrap.js가 로드된 후 설정
    window.addEventListener('load', function(ev) {
      // flutter_bootstrap.js가 로드될 때까지 대기
      if (window._flutter && window._flutter.loader) {
        window._flutter.loader.load({
          serviceWorkerSettings: {
            serviceWorkerVersion: serviceWorkerVersion,
          },
        }).then(function(engineInitializer) {
          return engineInitializer.initializeEngine({
            renderer: "html"
          });
        }).then(function(appRunner) {
          return appRunner.runApp();
        });
      } else {
        // flutter_bootstrap.js가 아직 로드되지 않았으면 대기
        var checkFlutter = setInterval(function() {
          if (window._flutter && window._flutter.loader) {
            clearInterval(checkFlutter);
            window._flutter.loader.load({
              serviceWorkerSettings: {
                serviceWorkerVersion: serviceWorkerVersion,
              },
            }).then(function(engineInitializer) {
              return engineInitializer.initializeEngine({
                renderer: "html"
              });
            }).then(function(appRunner) {
              return appRunner.runApp();
            });
          }
        }, 100);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
